<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bunny Ninja 3D</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #2a1520; font-family: Fredoka, sans-serif; }
  #c { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    color: #5a2a4a;
  }
  #topbar {
    position: absolute; left: 16px; top: 14px;
    text-shadow: 0 1px 0 #fff8;
  }
  #topbar .title { font-weight: 700; font-size: 20px; }
  #topbar .sub { font-weight: 500; font-size: 13px; opacity: 0.85; margin-top: 2px; }
  #meter {
    position: absolute; left: 50%; top: 28px; transform: translateX(-50%);
    width: 300px; display: none;
  }
  #meter .label {
    text-align: center; color: #fff; font-size: 14px; font-weight: 700;
    text-shadow: 0 2px 8px #0008; margin-bottom: 6px;
  }
  #meter .track {
    position: relative; height: 16px; border-radius: 10px;
    background: #eceff1; border: 2px solid #90a4ae;
  }
  #meter .green {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 28px; height: 28px; border-radius: 50%;
    background: #43a047; border: 2px solid #2e7d32;
  }
  #meter .arrow {
    position: absolute; top: -14px; width: 0; height: 0;
    border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-top: 12px solid #757575; transform: translateX(-50%);
  }
  #meter .arrow::after {
    content: ''; position: absolute; left: -2px; top: -16px;
    width: 4px; height: 22px; background: #757575;
  }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(255, 238, 248, 0.82);
  }
  #overlay.hidden { display: none; }
  #overlay .card { text-align: center; max-width: 560px; padding: 24px; }
  #overlay h1 { font-size: 56px; line-height: 1; margin-bottom: 12px; }
  #overlay p { font-size: 18px; margin: 8px 0; }
  #overlay .pulse { font-size: 26px; font-weight: 700; margin-top: 22px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
  #flash {
    position: absolute; inset: 0; background: rgba(255,50,80,0.35);
    display: none; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="topbar">
    <div class="title">Bunny Ninja 3D</div>
    <div class="sub">Deaths: <span id="deaths">0</span> · WASD move · Space jump/release · R restart</div>
  </div>
  <div id="meter">
    <div class="label">Release when the arrow hits the green!</div>
    <div class="track">
      <div class="green"></div>
      <div class="arrow" id="arrow"></div>
    </div>
  </div>
  <div id="overlay">
    <div class="card" id="overlayCard"></div>
  </div>
  <div id="flash"></div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const deathsEl = document.getElementById('deaths');
const meterEl = document.getElementById('meter');
const arrowEl = document.getElementById('arrow');
const overlay = document.getElementById('overlay');
const overlayCard = document.getElementById('overlayCard');
const flash = document.getElementById('flash');

const DEMO = new URLSearchParams(location.search).has('demo');

const GRAVITY = -28;
const MOVE_SPEED = 7.5;
const JUMP_V = 13.5;
const PLAYER_R = 0.32;
const PLAYER_H = 1.35;
const METER_PERIOD = 1.6;
const PERFECT_WINDOW = 0.12;
const WIN_VZ = 13;
const WIN_VY = 8;
const FAIL_VZ = 2.0;
const FAIL_VY = 2.0;

const keys = {};
let spaceEdge = false;
let rEdge = false;
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); spaceEdge = true; }
  if (e.code === 'KeyR') rEdge = true;
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#ffd6ec');
scene.fog = new THREE.Fog('#ffd6ec', 28, 85);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 6, -8);

const hemi = new THREE.HemisphereLight('#fff0f7', '#c9b6e4', 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffffff', 1.35);
sun.position.set(-8, 18, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -10;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 120),
  new THREE.MeshStandardMaterial({ color: '#f3e0ef', roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.02, 35);
ground.receiveShadow = true;
scene.add(ground);

function boxMesh(w, h, d, color, x, y, z) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0.05 })
  );
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

const platforms = [
  { minX: -3.2, maxX: 3.2, minZ: 0, maxZ: 12, y: 0 },
  { minX: -3.2, maxX: 3.2, minZ: 29, maxZ: 45.5, y: 0 },
  { minX: -4.5, maxX: 4.5, minZ: 52, maxZ: 76, y: 0 },
];

boxMesh(6.4, 1, 12, '#c9b6e4', 0, -0.5, 6);
boxMesh(6.4, 1, 16.5, '#c9b6e4', 0, -0.5, 37.25);
boxMesh(9, 1, 23, '#c9b6e4', 0, -0.5, 64.5);

const beam = {
  mesh: boxMesh(1.25, 0.28, 20, '#8d6e63', 0, 0, 20),
  minZ: 10, maxZ: 30, halfW: 0.7, baseY: 0, amp: 0.4, period: 2.2,
};
beam.mesh.material.color.set('#a1887f');

function makeGoo(z, depth) {
  const g = new THREE.Mesh(
    new THREE.BoxGeometry(8, 0.35, depth),
    new THREE.MeshStandardMaterial({
      color: '#ff4d6d', transparent: true, opacity: 0.92, roughness: 0.35, metalness: 0.1,
    })
  );
  g.position.set(0, -0.55, z);
  g.receiveShadow = true;
  scene.add(g);
  const gloss = new THREE.Mesh(
    new THREE.BoxGeometry(7.2, 0.05, depth * 0.9),
    new THREE.MeshStandardMaterial({ color: '#ff8fa3', transparent: true, opacity: 0.5 })
  );
  gloss.position.set(0, -0.35, z);
  scene.add(gloss);
  return { minX: -4, maxX: 4, minZ: z - depth / 2, maxZ: z + depth / 2, y: -0.4 };
}
const gooZones = [makeGoo(20, 18), makeGoo(48.8, 6.5)];

const barPivot = new THREE.Group();
barPivot.position.set(0, 3.8, 47);
scene.add(barPivot);
const rope = new THREE.Mesh(
  new THREE.CylinderGeometry(0.04, 0.04, 1.7, 8),
  new THREE.MeshStandardMaterial({ color: '#6d4c41' })
);
rope.position.y = -0.85;
barPivot.add(rope);
const bar = new THREE.Mesh(
  new THREE.CylinderGeometry(0.08, 0.08, 1.6, 12),
  new THREE.MeshStandardMaterial({ color: '#5d4037', metalness: 0.3, roughness: 0.4 })
);
bar.rotation.z = Math.PI / 2;
bar.position.y = -1.75;
barPivot.add(bar);
const hangHold = new THREE.Object3D();
hangHold.position.y = -1.75;
barPivot.add(hangHold);

boxMesh(0.35, 3.2, 0.35, '#8d6e63', -2.2, 1.1, 64);
boxMesh(0.35, 3.2, 0.35, '#8d6e63', 2.2, 1.1, 64);
const roof = boxMesh(5.2, 0.35, 1.4, '#e57373', 0, 2.85, 64);
roof.rotation.x = -0.15;

const flagPole = boxMesh(0.08, 2.4, 0.08, '#795548', 0.2, 1.2, 67);
const flagCloth = boxMesh(1.1, 0.7, 0.05, '#ff8a65', 0.75, 2.0, 67);
const flagHit = { minX: -0.8, maxX: 1.6, minZ: 66.2, maxZ: 68.2, y: 0 };

const petals = [];
for (let i = 0; i < 40; i++) {
  const p = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 6, 6),
    new THREE.MeshStandardMaterial({ color: '#ffb3d1', roughness: 0.8 })
  );
  p.position.set((Math.random() - 0.5) * 16, 1 + Math.random() * 8, Math.random() * 75);
  p.userData = { sp: 0.6 + Math.random() * 1.2, sway: Math.random() * Math.PI * 2 };
  scene.add(p);
  petals.push(p);
}

function makePlayer() {
  const root = new THREE.Group();
  const skin = '#ffe0cc';
  const pink = '#ffb3d1';
  const pinkD = '#f48fb1';
  const mask = '#c2185b';

  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.28, 0.35, 6, 10),
    new THREE.MeshStandardMaterial({ color: pink, roughness: 0.65 })
  );
  body.position.y = 0.7;
  body.castShadow = true;
  root.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.28, 16, 16),
    new THREE.MeshStandardMaterial({ color: skin, roughness: 0.7 })
  );
  head.position.y = 1.25;
  head.castShadow = true;
  root.add(head);

  const maskM = new THREE.Mesh(
    new THREE.SphereGeometry(0.245, 16, 12, 0, Math.PI * 2, 0.9, 1.0),
    new THREE.MeshStandardMaterial({ color: mask, roughness: 0.6 })
  );
  maskM.position.set(0, 1.18, 0.02);
  root.add(maskM);

  const band = new THREE.Mesh(
    new THREE.TorusGeometry(0.27, 0.035, 8, 16),
    new THREE.MeshStandardMaterial({ color: '#ad1457' })
  );
  band.rotation.x = Math.PI / 2;
  band.position.y = 1.34;
  root.add(band);

  for (const sx of [-1, 1]) {
    const ear = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.07, 0.28, 4, 8),
      new THREE.MeshStandardMaterial({ color: '#ffffff' })
    );
    ear.position.set(sx * 0.14, 1.62, -0.02);
    ear.castShadow = true;
    root.add(ear);
    const inner = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.03, 0.18, 4, 6),
      new THREE.MeshStandardMaterial({ color: pink })
    );
    inner.position.set(sx * 0.14, 1.62, 0.02);
    root.add(inner);
  }

  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshStandardMaterial({ color: '#fff' }));
  const eyeR = eyeL.clone();
  eyeL.position.set(-0.09, 1.28, 0.22);
  eyeR.position.set(0.09, 1.28, 0.22);
  root.add(eyeL, eyeR);
  const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), new THREE.MeshStandardMaterial({ color: '#333' }));
  const pupilR = pupilL.clone();
  pupilL.position.set(-0.09, 1.28, 0.26);
  pupilR.position.set(0.09, 1.28, 0.26);
  root.add(pupilL, pupilR);

  const katana = new THREE.Mesh(
    new THREE.BoxGeometry(0.06, 0.7, 0.06),
    new THREE.MeshStandardMaterial({ color: '#90a4ae', metalness: 0.6, roughness: 0.35 })
  );
  katana.position.set(-0.32, 0.85, -0.05);
  katana.rotation.z = 0.25;
  root.add(katana);

  const legL = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.18, 4, 8), new THREE.MeshStandardMaterial({ color: pinkD }));
  const legR = legL.clone();
  legL.position.set(-0.12, 0.25, 0);
  legR.position.set(0.12, 0.25, 0);
  root.add(legL, legR);

  scene.add(root);
  return { root, legL, legR };
}

const playerMesh = makePlayer();
const player = {
  x: 0, y: 0, z: 3,
  vx: 0, vy: 0, vz: 0,
  onGround: true,
  facing: 0,
  launchLock: 0,
};

let state = 'MENU';
let deaths = 0;
let time = 0;
let deadTimer = 0;
let meterT = 0;
let demoPhase = 'start';
let demoTimer = 0;
let demoReleaseArmed = false;
let confetti = [];

function beamY(t) {
  return beam.baseY + Math.sin((t / beam.period) * Math.PI * 2) * beam.amp;
}

function meterPos(t) {
  const cycle = (t % METER_PERIOD) / METER_PERIOD;
  return cycle < 0.5 ? cycle * 2 : 2 - cycle * 2;
}

function resetPlayer() {
  player.x = 0; player.y = 0; player.z = 3;
  player.vx = 0; player.vy = 0; player.vz = 0;
  player.onGround = true;
  player.launchLock = 0;
  playerMesh.root.visible = true;
  if (playerMesh.root.parent !== scene) {
    hangHold.remove(playerMesh.root);
    scene.add(playerMesh.root);
  }
  playerMesh.root.position.set(player.x, player.y, player.z);
  playerMesh.root.rotation.set(0, 0, 0);
}

function showMenu() {
  overlay.classList.remove('hidden');
  overlayCard.innerHTML = `
    <h1>Bunny Ninja 3D</h1>
    <p>A little bunny-eared ninja trains on the obstacle course.</p>
    <p>Cross the bounce beam. Swing the bar. Hit the green circle.</p>
    <div class="pulse">Press Space to start</div>`;
}

function showWin() {
  overlay.classList.remove('hidden');
  overlayCard.innerHTML = `
    <h1>You Win!</h1>
    <p>The bunny ninja cleared the 3D course!</p>
    <p>Deaths: ${deaths} · Press R to play again</p>`;
  spawnConfetti();
}

function hideOverlay() { overlay.classList.add('hidden'); }

function startGame() {
  deaths = 0;
  deathsEl.textContent = '0';
  resetPlayer();
  state = 'PLAYING';
  hideOverlay();
  meterEl.style.display = 'none';
  clearConfetti();
}

function kill() {
  if (state === 'DEAD' || state === 'WIN') return;
  deaths++;
  deathsEl.textContent = String(deaths);
  state = 'DEAD';
  deadTimer = 0.7;
  flash.style.display = 'block';
  player.vx = player.vz = player.vy = 0;
  if (playerMesh.root.parent !== scene) {
    hangHold.remove(playerMesh.root);
    scene.add(playerMesh.root);
  }
  meterEl.style.display = 'none';
}

function win() {
  state = 'WIN';
  player.vx = player.vz = 0;
  meterEl.style.display = 'none';
  showWin();
}

function spawnConfetti() {
  clearConfetti();
  const colors = [0xffb3d1, 0x81d4fa, 0xffe082, 0xa5d6a7, 0xce93d8];
  for (let i = 0; i < 50; i++) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, 0.1, 0.04),
      new THREE.MeshStandardMaterial({ color: colors[i % colors.length] })
    );
    m.position.set(player.x + (Math.random() - 0.5) * 6, 3 + Math.random() * 4, player.z + (Math.random() - 0.5) * 4);
    m.userData = {
      vx: (Math.random() - 0.5) * 3,
      vy: 1 + Math.random() * 3,
      vz: (Math.random() - 0.5) * 3,
    };
    scene.add(m);
    confetti.push(m);
  }
}
function clearConfetti() {
  for (const m of confetti) scene.remove(m);
  confetti = [];
}

function aabbFeetOnPlatform() {
  let best = null;
  for (const p of platforms) {
    if (player.x > p.minX && player.x < p.maxX && player.z > p.minZ && player.z < p.maxZ) {
      best = p.y;
    }
  }
  const by = beamY(time);
  if (player.x > -beam.halfW && player.x < beam.halfW && player.z > beam.minZ && player.z < beam.maxZ) {
    if (best === null || by >= best - 0.05) best = by;
  }
  return best;
}

function inGoo() {
  if (aabbFeetOnPlatform() !== null && player.y > -1.0) return false;
  if (player.y > 0.3) return false;
  for (const g of gooZones) {
    if (player.x > g.minX && player.x < g.maxX && player.z > g.minZ && player.z < g.maxZ) {
      return true;
    }
  }
  return player.y < -1.5;
}

function updateDemo(dt) {
  if (!DEMO) return;
  demoTimer += dt;
  if (state === 'MENU') {
    if (demoTimer > 1.1) { spaceEdge = true; demoPhase = 'run'; demoTimer = 0; }
    return;
  }
  if (state === 'WIN' || state === 'DEAD') {
    keys.ArrowUp = keys.KeyW = keys.Space = false;
    if (state === 'DEAD') { demoPhase = 'run'; demoReleaseArmed = false; }
    return;
  }
  if (state === 'SWINGING') {
    keys.ArrowUp = keys.KeyW = false;
    const pos = meterPos(meterT);
    const ang = Math.sin(time * 2.4);
    if (!demoReleaseArmed && meterT > 0.45 && ang > 0.2 && Math.abs(pos - 0.5) <= PERFECT_WINDOW) {
      spaceEdge = true;
      demoReleaseArmed = true;
      demoPhase = 'goal';
    } else if (demoReleaseArmed && meterT > 2.2) {
      spaceEdge = true;
    }
    return;
  }
  if (state === 'PLAYING') {
    keys.ArrowUp = true;
    keys.KeyW = true;
    if (demoPhase === 'run' && player.z > 43.2 && player.onGround) {
      spaceEdge = true;
      demoPhase = 'jumpBar';
    }
  }
}

function update(dt) {
  time += dt;
  updateDemo(dt);

  beam.mesh.position.y = beamY(time);
  flagCloth.position.x = 0.75 + Math.sin(time * 4) * 0.08;

  for (const p of petals) {
    p.position.y -= p.userData.sp * dt;
    p.position.x += Math.sin(time * 2 + p.userData.sway) * 0.4 * dt;
    if (p.position.y < 0) {
      p.position.y = 8;
      p.position.z = player.z + (Math.random() - 0.5) * 30;
    }
  }

  if (state === 'MENU') {
    if (spaceEdge) { spaceEdge = false; startGame(); }
    rEdge = false;
    updateCamera(dt);
    return;
  }

  if (state === 'WIN') {
    for (const m of confetti) {
      m.position.x += m.userData.vx * dt;
      m.position.y += m.userData.vy * dt;
      m.position.z += m.userData.vz * dt;
      m.userData.vy -= 6 * dt;
      m.rotation.x += dt * 4;
      m.rotation.z += dt * 3;
      if (m.position.y < 0) { m.position.y = 5; m.userData.vy = 2 + Math.random() * 2; }
    }
    if (rEdge) { rEdge = false; state = 'MENU'; clearConfetti(); showMenu(); }
    spaceEdge = false;
    updateCamera(dt);
    return;
  }

  if (state === 'DEAD') {
    deadTimer -= dt;
    flash.style.opacity = String(Math.max(0, deadTimer));
    if (deadTimer <= 0) {
      flash.style.display = 'none';
      resetPlayer();
      state = 'PLAYING';
    }
    spaceEdge = false;
    updateCamera(dt);
    return;
  }

  if (state === 'SWINGING') {
    meterT += dt;
    const ang = Math.sin(time * 2.4) * (70 * Math.PI / 180);
    barPivot.rotation.x = ang;
    const pos = meterPos(meterT);
    arrowEl.style.left = (pos * 100) + '%';

    if (spaceEdge) {
      spaceEdge = false;
      const perfect = Math.abs(pos - 0.5) <= PERFECT_WINDOW;
      const launchAng = perfect ? 0.5 : ang;
      barPivot.rotation.x = launchAng;
      hangHold.updateWorldMatrix(true, false);
      const wp = new THREE.Vector3();
      hangHold.getWorldPosition(wp);
      hangHold.remove(playerMesh.root);
      scene.add(playerMesh.root);
      player.x = wp.x;
      player.y = Math.max(0.4, wp.y - 0.15);
      player.z = wp.z;
      playerMesh.root.position.set(player.x, player.y, player.z);
      state = 'PLAYING';
      meterEl.style.display = 'none';
      barPivot.rotation.x = 0;
      if (perfect) {
        player.vx = 0;
        player.vy = WIN_VY;
        player.vz = WIN_VZ;
        player.z = Math.max(player.z, 48);
        player.launchLock = 1.25;
      } else {
        player.vx = 0;
        player.vy = FAIL_VY;
        player.vz = FAIL_VZ;
        player.launchLock = 1.0;
      }
      player.onGround = false;
    }
    updateCamera(dt);
    return;
  }

  if (state === 'PLAYING') {
    if (player.launchLock > 0) player.launchLock -= dt;

    let ix = 0, iz = 0;
    if (keys.ArrowLeft || keys.KeyA) ix -= 1;
    if (keys.ArrowRight || keys.KeyD) ix += 1;
    if (keys.ArrowUp || keys.KeyW) iz += 1;
    if (keys.ArrowDown || keys.KeyS) iz -= 1;
    if (player.launchLock <= 0) {
      if (ix || iz) {
        const len = Math.hypot(ix, iz);
        ix /= len; iz /= len;
        player.vx = ix * MOVE_SPEED;
        player.vz = iz * MOVE_SPEED;
        player.facing = Math.atan2(ix, iz);
      } else {
        player.vx = 0;
        player.vz = 0;
      }
    } else if (ix || iz) {
      player.facing = Math.atan2(ix, iz);
    }

    if (spaceEdge) {
      spaceEdge = false;
      if (player.onGround) {
        player.vy = JUMP_V;
        player.onGround = false;
      }
    }

    player.vy += GRAVITY * dt;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.z += player.vz * dt;
    player.x = THREE.MathUtils.clamp(player.x, -5, 5);

    player.onGround = false;
    const floorY = aabbFeetOnPlatform();
    if (floorY !== null && player.vy <= 2 && player.y <= floorY + 0.35 && player.y >= floorY - 0.85) {
      player.y = floorY;
      player.vy = 0;
      player.onGround = true;
    }

    if (inGoo()) kill();

    const hangY = barPivot.position.y - 1.75;
    const dx = player.x - barPivot.position.x;
    const dz = player.z - barPivot.position.z;
    const planar = Math.hypot(dx, dz);
    const nearHang =
      !player.onGround &&
      player.launchLock <= 0 &&
      planar < 2.4 &&
      player.y > 0.7 &&
      player.y < hangY + 0.8 &&
      player.z > 45 && player.z < 48.2;
    if (nearHang) {
      state = 'SWINGING';
      meterT = 0;
      meterEl.style.display = 'block';
      player.vx = player.vy = player.vz = 0;
      scene.remove(playerMesh.root);
      hangHold.add(playerMesh.root);
      playerMesh.root.position.set(0, -0.85, 0);
      playerMesh.root.rotation.set(0, 0, 0);
    }

    if (player.x > flagHit.minX && player.x < flagHit.maxX &&
        player.z > flagHit.minZ && player.z < flagHit.maxZ && player.y < 2.5) {
      win();
    }

    const walk = player.onGround && (Math.abs(player.vx) + Math.abs(player.vz) > 0.1);
    const wob = walk ? Math.sin(time * 14) * 0.35 : 0;
    playerMesh.legL.rotation.x = wob;
    playerMesh.legR.rotation.x = -wob;
    playerMesh.root.position.set(player.x, player.y, player.z);
    playerMesh.root.rotation.y = player.facing;
  }

  rEdge = false;
  updateCamera(dt);
}

const camPos = new THREE.Vector3(0, 5, -4);
const camTarget = new THREE.Vector3();
function updateCamera(dt) {
  const focus = state === 'SWINGING'
    ? new THREE.Vector3(barPivot.position.x, 2.2, barPivot.position.z)
    : new THREE.Vector3(player.x, player.y + 1.2, player.z);
  const desired = focus.clone().add(new THREE.Vector3(0, 4.2, -8.5));
  camPos.lerp(desired, 1 - Math.pow(0.001, dt));
  camTarget.lerp(focus, 1 - Math.pow(0.001, dt));
  camera.position.copy(camPos);
  camera.lookAt(camTarget);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

showMenu();
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.__probe = () => ({ state, deaths, z: player.z, y: player.y, demoPhase });
</script>
</body>
</html>
